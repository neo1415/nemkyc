name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm --workspace apps/backend audit --omit=dev --audit-level=high
